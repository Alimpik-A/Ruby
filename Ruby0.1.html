                            // Увеличиваем счетчик убийств для ударной волны
                            if (player.waveUnlocked) {
                                player.waveKills++;
                                if (player.waveKills >= 30) {
                                    player.waveCharge = Math.min(player.waveMaxCharge, player.waveCharge + 1);
                                    player.waveKills = 0;
                                }
                            }
                            
                            // Проверяем, нужно ли спавнить розового босса
                            if (miniBossKillCount >= 5) {
                                spawnPinkBoss();
                                miniBossKillCount = 0;
                            }
                            
                            // Удаляем мини-босса
                            pinkBosses.splice(j, 1);
                        }
                    }
                }
                
                // Проверка столкновения с финальным боссом
                if (finalBoss !== null && finalBoss.isActive) {
                    const boss = finalBoss;
                    const dx = boss.x - special.x;
                    const dy = boss.y - special.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < special.radius + boss.radius) {
                        // Наносим урон боссу (1 единица)
                        boss.health -= special.damage;
                        
                        // Обновляем интенсивность свечения в зависимости от здоровья
                        boss.glowIntensity = 0.5 + (1 - boss.health / boss.maxHealth) * 0.5;
                        
                        // Создаем частицы при получении урона
                        createParticles(boss.x, boss.y, boss.color, 5);
                        
                        // Проверяем, уничтожен ли босс
                        if (boss.health <= 0) {
                            // Создаем масштабный взрыв при смерти
                            createFinalBossExplosion(boss.x, boss.y, boss.color, 100);
                            
                            // Восстанавливаем стамину за убийство босса
                            player.stamina = Math.min(player.maxStamina, player.stamina + 10);
                            
                            // Разблокируем новую способность
                            if (!player.waveUnlocked) {
                                player.waveUnlocked = true;
                                abilityUnlockedTime = 120; // 2 секунды показа сообщения
                            }
                            
                            // Деактивируем босса
                            finalBoss.isActive = false;
                            finalBoss = null;
                        }
                    }
                }
                
                // Удаление вылетевших за пределы
                if (special.x < -50 || special.x > canvas.width + 50 || 
                    special.y < -50 || special.y > canvas.height + 50 ||
                    special.life <= 0) {
                    specialAttacks.splice(i, 1);
                }
            }
            
            // Обновление частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= particle.decay;
                
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            updateUI();
        }
        
        // Отрисовка игры
        function draw() {
            // Очистка canvas с эффектом затухания
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка частиц
            for (const particle of particles) {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
            
            // Отрисовка обычных врагов
            for (const enemy of enemies) {
                // Свечение врагов
                ctx.shadowBlur = 15;
                ctx.shadowColor = enemy.color;
                
                // Основной круг
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Яркое ядро для прямых атак
                if (enemy.directHit) {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemy.radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Пульсация для прямых атак
                    const pulseSize = enemy.radius * (1 + 0.3 * Math.sin(gameTime * 5));
                    ctx.strokeStyle = '#ff3333';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, pulseSize, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка крестиков
            for (const cross of crosses) {
                const alpha = cross.life / cross.maxLife;
                
                // Свечение крестика
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffffff';
                ctx.globalAlpha = alpha;
                
                // Внешний круг
                ctx.fillStyle = cross.color;
                ctx.beginPath();
                ctx.arc(cross.x, cross.y, cross.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Внутренний круг
                ctx.fillStyle = '#cccccc';
                ctx.beginPath();
                ctx.arc(cross.x, cross.y, cross.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                
                // Крест
                ctx.save();
                ctx.translate(cross.x, cross.y);
                ctx.rotate(cross.rotation);
                
                ctx.fillStyle = '#ffffff';
                
                // Вертикальная линия креста
                ctx.fillRect(-cross.radius * 0.15, -cross.radius * 0.7, 
                            cross.radius * 0.3, cross.radius * 1.4);
                
                // Горизонтальная линия креста
                ctx.fillRect(-cross.radius * 0.7, -cross.radius * 0.15, 
                            cross.radius * 1.4, cross.radius * 0.3);
                
                ctx.restore();
                
                // Эффект пульсации
                const pulse = 0.9 + 0.1 * Math.sin(gameTime * 3);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cross.x, cross.y, cross.radius * pulse, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка мини-боссов первого типа
            for (const boss of miniBosses) {
                // Интенсивность свечения зависит от здоровья
                const glowIntensity = boss.glowIntensity;
                
                // Свечение мини-босса
                ctx.shadowBlur = 15 + 25 * (1 - boss.health / boss.maxHealth);
                ctx.shadowColor = boss.color;
                
                // Основной круг мини-босса
                ctx.fillStyle = boss.color;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Внутренний круг
                const innerColor = `rgba(255, 255, 255, ${0.3 + 0.4 * (1 - boss.health / boss.maxHealth)})`;
                ctx.fillStyle = innerColor;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                
                // Ядро мини-босса с пульсацией
                const pulse = 0.8 + 0.2 * Math.sin(gameTime * 2);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius * 0.4 * pulse, 0, Math.PI * 2);
                ctx.fill();
                
                // Узор на мини-боссе
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius * 0.9, 0, Math.PI * 2);
                ctx.stroke();
                
                // Внутренние линии
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI / 4) * i + gameTime * 0.5;
                    const x1 = boss.x + Math.cos(angle) * boss.radius * 0.3;
                    const y1 = boss.y + Math.sin(angle) * boss.radius * 0.3;
                    const x2 = boss.x + Math.cos(angle) * boss.radius * 0.7;
                    const y2 = boss.y + Math.sin(angle) * boss.radius * 0.7;
                    
                    if (i === 0) ctx.moveTo(x1, y1);
                    else ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                }
                ctx.stroke();
                
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка мини-боссов второго типа
            for (const boss of shooterBosses) {
                // Интенсивность свечения зависит от здоровья
                const glowIntensity = boss.glowIntensity;
                
                // Свечение мини-босса
                ctx.shadowBlur = 10 + 20 * (1 - boss.health / boss.maxHealth);
                ctx.shadowColor = boss.color;
                
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.rotate(boss.rotation);
                
                // Основной круг мини-босса (шестиугольная форма для отличия)
                ctx.fillStyle = boss.color;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    const x = Math.cos(angle) * boss.radius;
                    const y = Math.sin(angle) * boss.radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                
                // Внутренний круг
                const innerColor = `rgba(255, 255, 255, ${0.3 + 0.4 * (1 - boss.health / boss.maxHealth)})`;
                ctx.fillStyle = innerColor;
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                
                // Ядро мини-босса
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Линии от центра к углам
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(
                        Math.cos(angle) * boss.radius * 0.9,
                        Math.sin(angle) * boss.radius * 0.9
                    );
                    ctx.stroke();
                }
                
                ctx.restore();
                
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка мини-боссов третьего типа
            for (const boss of waveBosses) {
                // Интенсивность свечения зависит от здоровья
                const glowIntensity = boss.glowIntensity;
                
                // Свечение мини-босса
                ctx.shadowBlur = 15 + 30 * (1 - boss.health / boss.maxHealth);
                ctx.shadowColor = boss.color;
                
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.rotate(boss.rotation);
                
                // Основной круг мини-босса (квадратная форма для отличия)
                ctx.fillStyle = boss.color;
                ctx.beginPath();
                // Рисуем квадрат
                const squareSize = boss.radius;
                ctx.rect(-squareSize, -squareSize, squareSize * 2, squareSize * 2);
                ctx.fill();
                
                // Внутренний круг
                const innerColor = `rgba(255, 255, 255, ${0.3 + 0.4 * (1 - boss.health / boss.maxHealth)})`;
                ctx.fillStyle = innerColor;
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius * 0.8, 0, Math.PI * 2);
                ctx.fill();
                
                // Ядро мини-босса
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                
                // Диагональные линии
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-boss.radius * 0.6, -boss.radius * 0.6);
                ctx.lineTo(boss.radius * 0.6, boss.radius * 0.6);
                ctx.moveTo(boss.radius * 0.6, -boss.radius * 0.6);
                ctx.lineTo(-boss.radius * 0.6, boss.radius * 0.6);
                ctx.stroke();
                
                ctx.restore();
                
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка мини-боссов четвертого типа (розовых)
            for (const boss of pinkBosses) {
                // Интенсивность свечения зависит от здоровья
                const glowIntensity = boss.glowIntensity;
                
                // Свечение мини-босса
                ctx.shadowBlur = 15 + 25 * (1 - boss.health / boss.maxHealth);
                ctx.shadowColor = boss.color;
                
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.rotate(boss.rotation);
                
                // Основной круг мини-босса
                ctx.fillStyle = boss.color;
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Внутренний круг
                const innerColor = `rgba(255, 255, 255, ${0.3 + 0.4 * (1 - boss.health / boss.maxHealth)})`;
                ctx.fillStyle = innerColor;
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
                
                // Ядро мини-босса
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                
                // Внешнее кольцо
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius * 1.1, 0, Math.PI * 2);
                ctx.stroke();
                
                // Внутренние линии (8 направлений)
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(
                        Math.cos(angle) * boss.radius * 0.9,
                        Math.sin(angle) * boss.radius * 0.9
                    );
                    ctx.stroke();
                }
                
                ctx.restore();
                
                // Индикатор состояния (цветная обводка)
                if (boss.state === 'chasing') {
                    ctx.strokeStyle = '#ff66cc';
                } else {
                    ctx.strokeStyle = '#ff0066'; // Более яркий цвет при атаке
                }
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius * 1.2, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка финального босса
            if (finalBoss !== null && finalBoss.isActive) {
                const boss = finalBoss;
                
                // Интенсивность свечения зависит от здоровья
                const glowIntensity = boss.glowIntensity;
                
                // Свечение босса
                ctx.shadowBlur = 20 + 40 * (1 - boss.health / boss.maxHealth);
                ctx.shadowColor = boss.color;
                
                // Основной круг босса (похож на игрока, но синий)
                ctx.fillStyle = boss.color;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Внутренний круг
                const innerColor = `rgba(255, 255, 255, ${0.3 + 0.4 * (1 - boss.health / boss.maxHealth)})`;
                ctx.fillStyle = innerColor;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                
                // Ядро босса с пульсацией
                const pulse = 0.8 + 0.2 * Math.sin(gameTime * 3);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius * 0.3 * pulse, 0, Math.PI * 2);
                ctx.fill();
                
                // Внешнее кольцо
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius * 1.1, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка атак игрока
            for (const attack of attacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.7 * (1 - progress);
                const radius = attack.radius * (0.8 + 0.2 * Math.sin(progress * Math.PI));
                
                // Свечение атаки
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#ff3333';
                
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius, attack.angle - Math.PI/2, attack.angle + Math.PI/2);
                ctx.lineTo(attack.x, attack.y);
                ctx.closePath();
                ctx.fill();
                
                // Внутренний слой
                ctx.fillStyle = '#ff6666';
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius * 0.7, attack.angle - Math.PI/2, attack.angle + Math.PI/2);
                ctx.lineTo(attack.x, attack.y);
                ctx.closePath();
                ctx.fill();
                
                // Самый внутренний слой
                ctx.fillStyle = '#ff9999';
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius * 0.4, attack.angle - Math.PI/2, attack.angle + Math.PI/2);
                ctx.lineTo(attack.x, attack.y);
                ctx.closePath();
                ctx.fill();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка атак врагов первого типа
            for (const attack of enemyAttacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.7 * (1 - progress);
                const radius = attack.radius * (0.8 + 0.2 * Math.sin(progress * Math.PI));
                
                // Свечение атаки врага
                ctx.shadowBlur = 30;
                ctx.shadowColor = attack.color;
                
                ctx.globalAlpha = alpha;
                ctx.fillStyle = attack.color;
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius, attack.angle - Math.PI/2, attack.angle + Math.PI/2);
                ctx.lineTo(attack.x, attack.y);
                ctx.closePath();
                ctx.fill();
                
                // Внутренний слой
                ctx.fillStyle = '#6699ff';
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius * 0.7, attack.angle - Math.PI/2, attack.angle + Math.PI/2);
                ctx.lineTo(attack.x, attack.y);
                ctx.closePath();
                ctx.fill();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка атак врагов второго типа (сюрикены)
            for (const attack of shooterBossAttacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.9 * (1 - progress * 0.5);
                
                // Свечение сюрикенов
                ctx.shadowBlur = 15;
                ctx.shadowColor = attack.color;
                ctx.globalAlpha = alpha;
                
                ctx.save();
                ctx.translate(attack.x, attack.y);
                ctx.rotate(attack.rotation);
                
                // Отрисовка сюрикена (звезда с 4 лучами, но меньшего размера)
                ctx.fillStyle = attack.color;
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI / 2) * i;
                    ctx.lineTo(
                        Math.cos(angle) * attack.radius,
                        Math.sin(angle) * attack.radius
                    );
                    ctx.lineTo(
                        Math.cos(angle + Math.PI/4) * attack.radius * 0.5,
                        Math.sin(angle + Math.PI/4) * attack.radius * 0.5
                    );
                }
                ctx.closePath();
                ctx.fill();
                
                // Ядро сюрикена
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, attack.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка атак врагов третьего типа (ударные волны)
            for (const attack of waveBossAttacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.6 * (1 - progress);
                const radius = attack.radius;
                
                // Свечение ударной волны
                ctx.shadowBlur = 30;
                ctx.shadowColor = attack.color;
                
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = attack.color;
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Внутренний слой
                ctx.strokeStyle = '#66ffcc';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius * 0.8, 0, Math.PI * 2);
                ctx.stroke();
                
                // Центр волны
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, 10, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка атак врагов четвертого типа (розовые сюрикены)
            for (const attack of pinkBossAttacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.9 * (1 - progress * 0.5);
                
                // Свечение сюрикенов
                ctx.shadowBlur = 15;
                ctx.shadowColor = attack.color;
                ctx.globalAlpha = alpha;
                
                ctx.save();
                ctx.translate(attack.x, attack.y);
                ctx.rotate(attack.rotation);
                
                // Отрисовка сюрикена (звезда с 4 лучами)
                ctx.fillStyle = attack.color;
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI / 2) * i;
                    ctx.lineTo(
                        Math.cos(angle) * attack.radius,
                        Math.sin(angle) * attack.radius
                    );
                    ctx.lineTo(
                        Math.cos(angle + Math.PI/4) * attack.radius * 0.5,
                        Math.sin(angle + Math.PI/4) * attack.radius * 0.5
                    );
                }
                ctx.closePath();
                ctx.fill();
                
                // Ядро сюрикена
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, attack.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка сюрикенов финального босса
            for (const attack of finalBossShurikenAttacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.9 * (1 - progress * 0.5);
                
                // Свечение сюрикенов
                ctx.shadowBlur = 15;
                ctx.shadowColor = attack.color;
                ctx.globalAlpha = alpha;
                
                ctx.save();
                ctx.translate(attack.x, attack.y);
                ctx.rotate(attack.rotation);
                
                // Отрисовка сюрикена (звезда с 4 лучами)
                ctx.fillStyle = attack.color;
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI / 2) * i;
                    ctx.lineTo(
                        Math.cos(angle) * attack.radius,
                        Math.sin(angle) * attack.radius
                    );
                    ctx.lineTo(
                        Math.cos(angle + Math.PI/4) * attack.radius * 0.5,
                        Math.sin(angle + Math.PI/4) * attack.radius * 0.5
                    );
                }
                ctx.closePath();
                ctx.fill();
                
                // Ядро сюрикена
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, attack.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка ближних атак финального босса
            for (const attack of finalBossMeleeAttacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.7 * (1 - progress);
                const radius = attack.radius * (0.8 + 0.2 * Math.sin(progress * Math.PI));
                
                // Свечение атаки врага
                ctx.shadowBlur = 30;
                ctx.shadowColor = attack.color;
                
                ctx.globalAlpha = alpha;
                ctx.fillStyle = attack.color;
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius, attack.angle - Math.PI/2, attack.angle + Math.PI/2);
                ctx.lineTo(attack.x, attack.y);
                ctx.closePath();
                ctx.fill();
                
                // Внутренний слой
                ctx.fillStyle = '#6699ff';
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius * 0.7, attack.angle - Math.PI/2, attack.angle + Math.PI/2);
                ctx.lineTo(attack.x, attack.y);
                ctx.closePath();
                ctx.fill();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка ударных волн игрока
            for (const attack of waveAttacks) {
                const progress = 1 - (attack.life / attack.maxLife);
                const alpha = 0.6 * (1 - progress);
                const radius = attack.radius;
                
                // Свечение ударной волны (белое)
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#ffffff';
                
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Внутренний слой
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, radius * 0.9, 0, Math.PI * 2);
                ctx.stroke();
                
                // Центр волны
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(attack.x, attack.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка супер-атак игрока (красные сюрикены с уроном 1)
            for (const special of specialAttacks) {
                const progress = 1 - (special.life / special.maxLife);
                const alpha = 0.9 * (1 - progress * 0.5);
                
                // Свечение сюрикенов
                ctx.shadowBlur = 20;
                ctx.shadowColor = special.color;
                ctx.globalAlpha = alpha;
                
                ctx.save();
                ctx.translate(special.x, special.y);
                ctx.rotate(special.rotation);
                
                // Отрисовка сюрикена (звезда с 4 лучами)
                ctx.fillStyle = special.color;
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI / 2) * i;
                    ctx.lineTo(
                        Math.cos(angle) * special.radius,
                        Math.sin(angle) * special.radius
                    );
                    ctx.lineTo(
                        Math.cos(angle + Math.PI/4) * special.radius * 0.5,
                        Math.sin(angle + Math.PI/4) * special.radius * 0.5
                    );
                }
                ctx.closePath();
                ctx.fill();
                
                // Ядро сюрикена
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, special.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            
            // Отрисовка игрока
            // Свечение игрока
            ctx.shadowBlur = 25;
            ctx.shadowColor = player.color;
            
            // Основной круг игрока
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Внутренний круг
            ctx.fillStyle = '#ff6666';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius * 0.6, 0, Math.PI * 2);
            ctx.fill();
            
            // Ядро игрока
            const pulse = 0.8 + 0.2 * Math.sin(gameTime * 3);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius * 0.3 * pulse, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            
            // Отрисовка границы поля
            ctx.strokeStyle = 'rgba(255, 50, 50, 0.2)';
            ctx.lineWidth = 2;
            ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
        }
        
        // Главный игровой цикл
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Обработчики клавиш
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'KeyE') {
                performAttack();
            }
            
            if (e.code === 'KeyQ') {
                performSpecialAttack();
            }
            
            if (e.code === 'KeyF') {
                performWaveAttack();
            }
            
            // Перезапуск игры при нажатии R
            if (e.code === 'KeyR' && gameOver) {
                restartGame();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        // Перезапуск игры
        function restartGame() {
            player = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 20,
                speed: 10,
                color: '#ff3333',
                health: 10,
                maxHealth: 10,
                stamina: 5,
                maxStamina: 10,
                specialCharge: 0,
                specialMax: 6,
                waveUnlocked: false,
                waveCharge: 0,
                waveMaxCharge: 30,
                waveKills: 0,
                lastSpecialUse: 0
            };
            
            enemies = [];
            crosses = [];
            miniBosses = [];
            shooterBosses = [];
            waveBosses = [];
            pinkBosses = [];
            finalBoss = null;
            attacks = [];
            enemyAttacks = [];
            shooterBossAttacks = [];
            waveBossAttacks = [];
            pinkBossAttacks = [];
            finalBossShurikenAttacks = [];
            finalBossMeleeAttacks = [];
            waveAttacks = [];
            particles = [];
            specialAttacks = [];
            
            gameTime = 0;
            enemySpawnRate = 1000;
            lastEnemySpawn = 0;
            lastHealthRegen = 0;
            lastStaminaRegen = 0;
            lastCrossSpawn = 0;
            lastMiniBossSpawn = 0;
            lastShooterBossSpawn = 0;
            lastWaveBossSpawn = 0;
            miniBossKillCount = 0;
            bossSpawned = false;
            bossWarningTime = 0;
            abilityUnlockedTime = 0;
            
            gameOver = false;
            gameStartTime = Date.now();
            
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('bossWarning').style.opacity = 0;
            document.getElementById('abilityUnlocked').style.opacity = 0;
            document.getElementById('waveBar').style.display = 'none';
        }
        
        // Запуск игры
        gameLoop();
    </script>
</body>
</html>
